# CI jobs

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly build
    - cron: '15 15 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: build wifi-img-streamer example using build script
      run: docker run --rm -v ${PWD}:/module bitcraze/aideck tools/build/build

    - name: build test_camera example
      run: docker run --rm -v ${PWD}:/module bitcraze/aideck tools/build/make-example examples/other/test_functionalities/test_camera build image

    - name: build uart_send_char example
      run: docker run --rm -v ${PWD}:/module bitcraze/aideck tools/build/make-example examples/other/test_functionalities/uart_send_char build image

    - name: build com-test example
      run: docker run --rm -v ${PWD}:/module bitcraze/aideck tools/build/make-example examples/other/com-test build image

    # NanoCockpit is developed and tested with GAP SDK 3.8.1. make-example isn't
    # used because its numpy pin doesn't install on that image's Python.
    - name: build nanocockpit streamer example
      run: docker run --rm -v ${PWD}:/module -w /module bitcraze/aideck:3.8.1 bash -c "source /gap_sdk/configs/ai_deck.sh && make -C nanocockpit/examples/streamer build image"

    - name: build nanocockpit cpx example
      run: docker run --rm -v ${PWD}:/module -w /module bitcraze/aideck:3.8.1 bash -c "source /gap_sdk/configs/ai_deck.sh && make -C nanocockpit/examples/cpx build image"

    - name: build nanocockpit coroutine example
      run: docker run --rm -v ${PWD}:/module -w /module bitcraze/aideck:3.8.1 bash -c "source /gap_sdk/configs/ai_deck.sh && make -C nanocockpit/examples/coroutine build image"

    - name: build nanocockpit queue example
      run: docker run --rm -v ${PWD}:/module -w /module bitcraze/aideck:3.8.1 bash -c "source /gap_sdk/configs/ai_deck.sh && make -C nanocockpit/examples/queue build image"

    - name: build nanocockpit queue_async example
      run: docker run --rm -v ${PWD}:/module -w /module bitcraze/aideck:3.8.1 bash -c "source /gap_sdk/configs/ai_deck.sh && make -C nanocockpit/examples/queue_async build image"

    - name: rename bin file
      run: cp examples/other/com-test/BUILD/GAP8_V2/GCC_RISCV_FREERTOS/target.board.devices.flash.img aideck_gap8.bin

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.sha }}
        path: aideck_gap8.bin
