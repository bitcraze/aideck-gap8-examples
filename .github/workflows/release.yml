# Build the streamer binaries and create a draft GitHub release. Run it on a tag.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tag:
    name: Check that this runs on a tag
    runs-on: ubuntu-latest

    steps:
    - name: Fail when started on a branch
      if: github.ref_type != 'tag'
      run: |
        echo "::error::Run this workflow on a tag, not on a branch"
        exit 1

  release:
    permissions:
      contents: write  # for softprops/action-gh-release to create a release
    name: Create draft GitHub release
    needs: check-tag
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Build wifi-img-streamer
      run: docker run --rm -v ${PWD}:/module bitcraze/aideck tools/build/build

    # NanoCockpit is developed and tested with GAP SDK 3.8.1, see CI.yml
    - name: Build NanoCockpit streamer
      run: docker run --rm -v ${PWD}:/module -w /module bitcraze/aideck:3.8.1 bash -c "source /gap_sdk/configs/ai_deck.sh && make -C nanocockpit/examples/streamer build image"

    # The file names have no version in them, so that links to the latest release keep working
    - name: Name the binaries
      run: |
        cp examples/other/wifi-img-streamer/BUILD/GAP8_V2/GCC_RISCV_FREERTOS/target.board.devices.flash.img aideck_gap8_wifi_img_streamer_with_ap.bin
        cp nanocockpit/examples/streamer/BUILD/GAP8_V2/GCC_RISCV/target.board.devices.flash.img aideck_gap8_nanocockpit_streamer.bin

    - name: Create draft release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: true
        fail_on_unmatched_files: true
        files: |
          aideck_gap8_wifi_img_streamer_with_ap.bin
          aideck_gap8_nanocockpit_streamer.bin
